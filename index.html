<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f9f9f9;
            color: #333;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }


        header h1 {
            font-size: 2.5em;
            color: #4CAF50;
        }
        main {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }
        footer {
            text-align: center;
            margin-top: 40px;
            color: #888;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Simple Website</h1>
    </header>
    <main>
        <p>This is a basic HTML page. You can add your own content here!</p>
        <ul>
            <li>Easy to edit</li>
            <li>Clean and minimal design</li>
            <li>Ready to use</li>
        </ul>
    </main>
    <footer>
        &copy; 2024 Simple Website
    </footer>
</body>
</html>
